# Supabase CLI config (only the parts this repo relies on).
# Every function verifies the custom session itself (x-session-token header), so the
# gateway JWT check is disabled for all of them. Deploy with --no-verify-jwt as well.
project_id = "ouderapp"

[functions.accept-invitation]
verify_jwt = false

[functions.ai-assistant]
verify_jwt = false

[functions.ai-coach]
verify_jwt = false

[functions.auth-login]
verify_jwt = false

[functions.auth-reset-password]
verify_jwt = false

[functions.auth-signup]
